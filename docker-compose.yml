services:
  api:
    build: .
    entrypoint: ""
    command: >
      sh -lc "python -c 'from tradingagents.api.db import init_db; init_db()' &&
      uvicorn tradingagents.api.app:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://tradingagents:tradingagents@postgres:5432/tradingagents}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents

  worker:
    build: .
    entrypoint: ""
    command: >
      sh -lc "celery -A tradingagents.worker.celery_app worker
      --loglevel=info
      --concurrency=${TRADINGAGENTS_WORKER_CONCURRENCY:-5}
      --prefetch-multiplier=1"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://tradingagents:tradingagents@postgres:5432/tradingagents}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents

  beat:
    build: .
    entrypoint: ""
    command: >
      celery -A tradingagents.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://tradingagents:tradingagents@postgres:5432/tradingagents}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents

  tradingagents:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+psycopg://tradingagents:tradingagents@postgres:5432/tradingagents}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - postgres
      - redis
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    tty: true
    stdin_open: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tradingagents
      POSTGRES_USER: tradingagents
      POSTGRES_PASSWORD: tradingagents
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql+psycopg://tradingagents:tradingagents@postgres:5432/tradingagents}
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://redis:6379/0}
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
    depends_on:
      - ollama
      - postgres
      - redis
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_data:
  ollama_data:
  postgres_data:
  redis_data:
